# Personal Lynx configuration optimized for Neovim and qutebrowser-like minimal GUI.

# Keyboard Navigation (Vim-like qutebrowser style)
VI_KEYS_ALWAYS_ON:TRUE
EMACS_KEYS_ALWAYS_ON:FALSE
USE_MOUSE:TRUE

# Character Set & Encoding
CHARACTER_SET:UTF-8
ASSUME_CHARSET:UTF-8
ASSUME_LOCAL_CHARSET:UTF-8

# CSS 2.1 & Color Style Configuration
COLOR_STYLE:Downloads/Lynx/lynx-nvim.lss
NESTED_TABLES:TRUE
DEFAULT_COLORS:TRUE
PARTIAL:FALSE
ENABLE_SCROLLBACK:FALSE
PRETTYSRC:TRUE
MAKE_LINKS_FOR_ALL_IMAGES:FALSE
MAKE_PSEUDO_ALTS_FOR_INLINES:FALSE
SUBCOLLAPSE:TRUE

# Minimal qutebrowser-like UI Settings
SHOW_CURSOR:TRUE
SHOW_KB_NAME:FALSE
INFOSECS:1
MESSAGESECS:1
NO_PAUSE:TRUE
HELPFILE:https://lynx.invisible-island.net/lynx_help/lynx_help_main.html

# Session & Network Defaults
PERSISTENT_COOKIES:TRUE
COOKIE_FILE:~/.config/lynx/cookies
SET_COOKIES:TRUE
ACCEPT_ALL_COOKIES:TRUE
SOURCE_CACHE:MEMORY
HISTORY:100
SAVE_SPACE:~/Downloads/lynx/
DEFAULT_EDITOR:nvim
HTTP_PROTOCOL:1.1
PREFERRED_LANGUAGE:en-us
PREFERRED_CHARSET:utf-8
SHORT_URL:TRUE
DEFAULT_INDEX_FILE:https://duckduckgo.com/html/
STARTFILE:https://duckduckgo.com/html/

# Document & External Viewers (.pdf, etc.)
VIEWER:application/pdf:python3 Downloads/Lynx/pdf_viewer.py %s:NON_XWINDOWS
VIEWER:application/pdf:python Downloads/Lynx/pdf_viewer.py %s:NON_XWINDOWS
